<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Map Visualizer Pro</title>
  <script type="module" crossorigin src="/states-of-india/assets/index-D6XBB-rc.js"></script>
  <link rel="stylesheet" crossorigin href="/states-of-india/assets/index-BrAdoBDO.css">
</head>

<body>
    <header>
        <div class="logo">
            <i data-lucide="map-pin"></i>
            IndiaMap Visualizer
        </div>
        <div class="header-actions">
            <button id="download-btn" class="btn">
                <i data-lucide="download"></i>
                Export Visualization
            </button>
        </div>
    </header>

    <main class="main-container" style="flex-direction: row-reverse;">
        <aside class="sidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <button id="reset-all-btn" class="btn btn-secondary" style="width: 100%; font-size: 0.75rem; background: #fee2e2; border-color: #fecaca; color: #991b1b;">
                    <i data-lucide="rotate-ccw" style="width:14px; height:14px;"></i> Reset to Default
                </button>
            </div>

            <details class="sidebar-section" open>
                <summary class="section-title"><i data-lucide="file-text" size="14"></i> Data Import</summary>
                <div class="section-content">
                    <div class="input-field">
                        <label>Upload CSV</label>
                        <input type="file" id="csv-upload" accept=".csv" style="font-size: 0.7rem;">
                    </div>
                </div>
            </details>

            <details class="sidebar-section" open>
                <summary class="section-title"><i data-lucide="settings" size="14"></i> Map & Title Settings</summary>
                <div class="section-content">
                    <div class="input-field">
                        <label>Main Title (use \n for subtitle)</label>
                        <textarea id="map-title-input" rows="2"
                            placeholder="States of India"
                            style="width:100%; font-size: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; padding: 0.25rem;">States of India</textarea>
                    </div>
                    <div class="input-field">
                        <label>Map Scale (Size)</label>
                        <div class="range-input">
                            <input type="range" id="map-scale" min="400" max="3000" value="1200">
                            <span id="scale-val">1200</span>
                        </div>
                    </div>
                    <div class="color-pickers">
                        <div class="input-field">
                            <label>Border Color</label>
                            <input type="color" id="border-color" value="#191919">
                        </div>
                        <div class="input-field">
                            <label>Border Thickness</label>
                            <div class="range-input">
                                <input type="range" id="border-thickness" min="0.1" max="5" step="0.1" value="0.7">
                                <span id="border-val">0.7</span>
                            </div>
                        </div>
                    </div>
                </div>
            </details>

            <details class="sidebar-section">
                <summary class="section-title"><i data-lucide="layers" size="14"></i> Scale Bar / Legend</summary>
                <div class="section-content">
                    <div class="input-field" style="flex-direction:row; gap:1rem; align-items:center;">
                        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                            <input type="checkbox" id="show-legend" checked> Show Legend
                        </label>
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <label style="font-size:0.7rem; margin:0;">Dir:</label>
                            <select id="legend-direction" style="font-size:0.7rem; padding:0.2rem;">
                                <option value="horizontal">Horizontal</option>
                                <option value="vertical">Vertical</option>
                            </select>
                        </div>
                    </div>
                    <div class="color-pickers">
                        <div class="input-field">
                            <label>Legend X</label>
                            <input type="number" id="legend-x" value="20" style="width: 50px;">
                        </div>
                        <div class="input-field">
                            <label>Legend Y</label>
                            <input type="number" id="legend-y" value="20" style="width: 50px;">
                        </div>
                    </div>
                </div>
            </details>

            <details class="sidebar-section">
                <summary class="section-title"><i data-lucide="palette" size="14"></i> Heat Map Palette</summary>
                <div class="section-content">
                    <div class="input-field">
                        <label>Predefined Palettes</label>
                        <select id="palette-select">
                            <option value="">Custom...</option>
                            <option value="Viridis">Viridis</option>
                            <option value="Plasma">Plasma</option>
                            <option value="Inferno">Inferno</option>
                            <option value="Magma">Magma</option>
                            <option value="Cividis">Cividis</option>
                            <option value="Turbo">Turbo</option>
                            <option value="Spectral">Spectral</option>
                            <option value="Rocket">Rocket</option>
                            <option value="Mako">Mako</option>
                            <option value="Blues">Blues</option>
                            <option value="Greens">Greens</option>
                            <option value="Reds">Reds</option>
                            <option value="Purples">Purples</option>
                            <option value="Oranges">Oranges</option>
                            <option value="YlGnBu">YlGnBu</option>
                            <option value="YlOrRd">YlOrRd</option>
                            <option value="RdYlBu">RdYlBu</option>
                            <option value="RdGy">RdGy</option>
                        </select>
                    </div>
                    <div id="gradient-stops-container" class="control-group" style="gap: 0.5rem; padding: 0;">
                        <!-- Gradient stops will be rendered here -->
                    </div>
                    <button id="add-stop-btn" class="btn btn-secondary" style="padding: 0.4rem; font-size: 0.7rem;">+ Add Color Stop</button>
                </div>
            </details>

            <details class="sidebar-section">
                <summary class="section-title"><i data-lucide="type" size="14"></i> Text Customization</summary>
                <div class="section-content">
                    <div class="input-field">
                        <label>Font Family</label>
                        <select id="label-font">
                            <option value="Times New Roman" selected>Times New Roman</option>
                            <option value="Arial">Arial</option>
                            <option value="Serif">Serif</option>
                        </select>
                    </div>
                    <div class="color-pickers">
                        <div class="input-field">
                            <label>Font Color</label>
                            <input type="color" id="label-color" value="#333333">
                        </div>
                        <div class="input-field">
                            <label>Lines Color</label>
                            <input type="color" id="line-color" value="#94a3b8">
                        </div>
                    </div>
                    
                    <div style="background: #e2e8f055; padding: 0.5rem; border-radius: 6px;">
                        <label style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.3rem; display: block;">State Name Styling</label>
                        <div class="input-field" style="flex-direction: row; gap: 1rem; align-items: center;">
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size: 0.75rem;">
                                <input type="checkbox" id="label-bold"> Bold
                            </label>
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size: 0.75rem;">
                                <input type="checkbox" id="label-italic"> Italic
                            </label>
                        </div>
                        <div class="input-field" style="margin-top: 0.5rem;">
                            <label style="font-size: 0.75rem;">Font Size</label>
                            <div class="range-input">
                                <input type="range" id="label-size" min="6" max="30" value="12">
                                <span id="size-val">12px</span>
                            </div>
                        </div>
                    </div>

                    <div style="background: #e2e8f055; padding: 0.5rem; border-radius: 6px; margin-top: 0.5rem;">
                        <label style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.3rem; display: block;">Value Label Styling</label>
                        <div class="input-field" style="flex-direction: row; gap: 1rem; align-items: center;">
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size: 0.75rem;">
                                <input type="checkbox" id="value-bold" checked> Bold
                            </label>
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size: 0.75rem;">
                                <input type="checkbox" id="value-italic"> Italic
                            </label>
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer; font-size: 0.75rem; margin-left: auto;">
                                <input type="checkbox" id="show-values" checked> Show
                            </label>
                        </div>
                        <div class="input-field" style="margin-top: 0.5rem;">
                            <label style="font-size: 0.75rem;">Font Size</label>
                            <div class="range-input">
                                <input type="range" id="value-size-global" min="6" max="30" value="15">
                                <span id="vsize-val">15px</span>
                            </div>
                        </div>
                        <div class="color-pickers" style="margin-top: 0.5rem;">
                            <div class="input-field">
                                <label style="font-size: 0.75rem;">Value Prefix</label>
                                <input type="text" id="value-prefix" placeholder="e.g. $" style="font-size: 0.75rem; padding: 0.2rem;">
                            </div>
                            <div class="input-field">
                                <label style="font-size: 0.75rem;">Value Suffix</label>
                                <input type="text" id="value-suffix" placeholder="e.g. %" style="font-size: 0.75rem; padding: 0.2rem;">
                            </div>
                        </div>
                    </div>

                    <div class="input-field">
                        <label>Label Angle</label>
                        <div class="range-input">
                            <input type="range" id="label-angle" min="-180" max="180" value="0">
                            <span id="angle-val">0°</span>
                        </div>
                    </div>
                </div>
            </details>

            <details class="sidebar-section">
                <summary class="section-title"><i data-lucide="download" size="14"></i> Download Panel</summary>
                <div class="section-content">
                    <label>Aspect Ratio Presets</label>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                            <span style="font-size: 0.65rem; color: var(--text-muted); width: 100%;">Square</span>
                            <button class="btn btn-secondary ratio-btn" data-ratio="1:1" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">1:1</button>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                            <span style="font-size: 0.65rem; color: var(--text-muted); width: 100%;">Vertical</span>
                            <button class="btn btn-secondary ratio-btn" data-ratio="9:16" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">9:16</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="4:5" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">4:5</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="3:4" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">3:4</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="2:3" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">2:3</button>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                            <span style="font-size: 0.65rem; color: var(--text-muted); width: 100%;">Horizontal</span>
                            <button class="btn btn-secondary ratio-btn" data-ratio="16:9" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">16:9</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="5:4" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">5:4</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="4:3" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">4:3</button>
                            <button class="btn btn-secondary ratio-btn" data-ratio="3:2" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">3:2</button>
                        </div>
                    </div>
                </div>
            </details>

            <details class="sidebar-section">
                <summary class="section-title" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span><i data-lucide="layers" size="14"></i> State Table</span>
                    <div style="display:flex; gap:0.5rem; margin-left: auto;">
                        <button id="undo-btn" class="btn btn-secondary"
                            style="padding: 0.25rem 0.5rem; font-size: 0.65rem;" disabled>
                            <i data-lucide="undo" style="width:12px; height:12px;"></i> Undo
                        </button>
                        <button id="clear-colors-btn" class="btn btn-secondary"
                            style="padding: 0.25rem 0.5rem; font-size: 0.65rem;">Reset Layout</button>
                    </div>
                </summary>
                <div class="section-content" style="padding: 0;">
                    <div class="data-table-container" style="max-height: 400px; border: none; border-radius: 0;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th title="Name Size">SzN</th>
                                    <th title="Name Color">ClN</th>
                                    <th title="Line Show" style="border-left:1px solid #ddd;">Ln</th>
                                    <th title="Line Alignment">Al</th>
                                    <th title="Value" style="border-left:1px solid #ddd;">Val</th>
                                    <th title="Value Size">SzV</th>
                                    <th title="Value Color">ClV</th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>
                </div>
            </details>
        </aside>

        <section class="viewer">
            <div id="map-export-area">
                <div id="title-container" style="position: absolute; width: 100%; pointer-events: none; z-index: 10;">
                    <h1 id="map-title-display"></h1>
                </div>
                <div id="map-container">
                    <svg id="india-map"></svg>
                </div>
                <div class="legend" id="map-legend"
                    style="display: none; position: absolute; pointer-events: all; cursor: move; z-index: 20;">
                </div>
            </div>
            <div class="tooltip" id="tooltip"></div>
        </section>
    </main>

</body>

</html>
